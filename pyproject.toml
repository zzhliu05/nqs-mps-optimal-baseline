[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nqs-mps"
version = "0.1.0"
description = "Consolidated torus MPS variational Monte Carlo research runtime"
requires-python = ">=3.10"
dependencies = ["jax>=0.4.30", "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "numba>=0.59"]

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[project.scripts]
nqs-mps = "nqs_mps.cli:main"
nqs-magnetoroton = "nqs_torus_laqx_nes.magnetoroton_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

